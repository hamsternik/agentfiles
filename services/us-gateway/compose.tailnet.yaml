# Added by `af gateway up` when the host has a Tailscale IP: also publish the
# proxy on the tailnet address only (never 0.0.0.0, never the LAN), so the
# cockpit's "us" Chrome profile can use it. Restrict who may reach port 8888
# with Tailscale ACLs.
services:
  gluetun:
    ports:
      - "${AF_TAILSCALE_IP}:${AF_US_PROXY_PORT:-8888}:8888/tcp"
