# US egress gateway: gluetun connected to a VPN provider over WireGuard, exposing
# an HTTP proxy. Started by `af gateway up`, which injects secrets from the
# Keychain as environment variables (never written to disk).
#
# Other containers can route ALL their traffic through it with:
#   network_mode: "container:af-us-gateway"
# The kill switch blocks traffic if the tunnel drops.
services:
  gluetun:
    # Pinned: tag for humans, digest for docker (":latest" follows the development branch).
    # Bump on purpose; af versions compares the running image with this digest.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: af-us-gateway
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:${AF_US_PROXY_PORT:-8888}:8888/tcp"
    environment:
      VPN_SERVICE_PROVIDER: ${AF_US_GATEWAY_PROVIDER:-mullvad}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?run via 'af gateway up'}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:?run via 'af gateway up'}
      SERVER_COUNTRIES: ${AF_US_GATEWAY_COUNTRIES:-USA}
      SERVER_CITIES: ${AF_US_GATEWAY_CITIES:-}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      TZ: UTC
